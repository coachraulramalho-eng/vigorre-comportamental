<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | VIGORRE ONE™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="assets/images/logo-vigorre.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-container {
            max-width: 440px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 12px 48px rgba(10,37,64,0.12);
            border: 1px solid #E2E8F0;
        }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #0A2540;
        }
        .login-logo .logo-text .highlight { color: #D97706; }
        .login-logo .logo-text .tm { font-size: 0.5rem; vertical-align: super; color: #94A3B8; }
        .login-logo .logo-sub {
            font-size: 0.7rem;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 2px;
        }
        .login-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .login-subtitle { font-size: 0.85rem; color: #64748B; margin-bottom: 20px; }
        .test-credentials {
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }
        .test-credentials .title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #0A2540;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .test-credentials .user-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            border-bottom: 1px solid #E2E8F0;
        }
        .test-credentials .user-row:last-child { border-bottom: none; }
        .test-credentials .user-row:hover { background: #E2E8F0; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #F8FAFC;
        }
        .form-group input:focus {
            outline: none;
            border-color: #D97706;
            box-shadow: 0 0 0 3px rgba(217,119,6,0.1);
        }
        .terms {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            font-size: 0.8rem;
            color: #475569;
            margin: 12px 0;
        }
        .terms input { margin-top: 2px; }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #D97706, #F59E0B);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .message.error { display: block; background: #FEE2E2; color: #EF4444; }
        .message.success { display: block; background: #D1FAE5; color: #10B981; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <div class="logo-text">
                VIGORRE <span class="highlight">ONE</span><span class="tm">™</span>
            </div>
            <div class="logo-sub">People Intelligence Enterprise</div>
        </div>

        <h1 class="login-title">Acessar Plataforma</h1>
        <p class="login-subtitle">Entre com suas credenciais para continuar</p>

        <div class="test-credentials">
            <div class="title">🔑 Credenciais de Teste</div>
            <div class="user-row" data-email="admin@vigorre.com" data-password="Admin@2026">
                <span>👑 Admin</span><span>admin@vigorre.com</span>
            </div>
            <div class="user-row" data-email="empresa@vigorre.com" data-password="Empresa@2026">
                <span>🏢 Empresa</span><span>empresa@vigorre.com</span>
            </div>
            <div class="user-row" data-email="participante@vigorre.com" data-password="Part@2026">
                <span>👤 Participante</span><span>participante@vigorre.com</span>
            </div>
        </div>

        <div class="message" id="loginMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <div class="terms">
                <input type="checkbox" id="acceptTerms" />
                <label for="acceptTerms">
                    Li e aceito os <a href="termos-uso.html">Termos de Uso</a> e a
                    <a href="politica-privacidade.html">Política de Privacidade</a>.
                </label>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">🔑 Entrar</button>
        </form>
    </div>

    <script>
        var USERS = {
            'admin@vigorre.com': { name: 'Administrador', role: 'admin', id: 'admin_001', password: 'Admin@2026' },
            'empresa@vigorre.com': { name: 'Empresa Teste', role: 'organizacao', id: 'org_001', password: 'Empresa@2026' },
            'participante@vigorre.com': { name: 'João Silva', role: 'participante', id: 'part_001', password: 'Part@2026' }
        };

        var REDIRECTS = {
            admin: '/admin/dashboard.html',
            organizacao: '/organizacao/dashboard.html',
            participante: '/participante/dashboard.html'
        };

        function showMessage(text, type) {
            var el = document.getElementById('loginMessage');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        document.addEventListener('DOMContentLoaded', function () {
            var rows = document.querySelectorAll('.user-row');
            var emailInput = document.getElementById('email');
            var passInput = document.getElementById('password');

            rows.forEach(function (row) {
                row.addEventListener('click', function () {
                    emailInput.value = this.getAttribute('data-email');
                    passInput.value = this.getAttribute('data-password');
                });
            });

            var form = document.getElementById('loginForm');
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var email = emailInput.value.trim();
                var password = passInput.value.trim();
                var accept = document.getElementById('acceptTerms');

                if (!email || !password) {
                    showMessage('Preencha todos os campos.', 'error');
                    return;
                }

                if (!accept.checked) {
                    showMessage('É necessário aceitar os termos para continuar.', 'error');
                    return;
                }

                var userData = USERS[email];
                if (!userData) {
                    showMessage('Usuário não encontrado.', 'error');
                    return;
                }

                if (userData.password !== password) {
                    showMessage('Senha incorreta.', 'error');
                    return;
                }

                // Monta usuário completo
                var user = {
                    id: userData.id,
                    email: email,
                    name: userData.name,
                    role: userData.role,
                    loginAt: new Date().toISOString(),
                    consentimento: true
                };

                if (user.role === 'admin') {
                    user.adminId = user.id;
                } else if (user.role === 'organizacao') {
                    user.companyId = user.id;
                    user.companyName = user.name;
                } else if (user.role === 'participante') {
                    user.participantId = user.id;
                }

                // Registra consentimento
                localStorage.setItem('consentimento_' + user.id, JSON.stringify({
                    consentido: true,
                    versao: '3.0',
                    data: new Date().toISOString()
                }));

                // Salva sessão
                localStorage.setItem('vigorre_session', JSON.stringify({
                    user: user,
                    timestamp: Date.now(),
                    consentGiven: true
                }));

                showMessage('Login realizado com sucesso! Redirecionando...', 'success');

                setTimeout(function () {
                    window.location.href = REDIRECTS[user.role] || '/login.html';
                }, 700);
            });
        });
    </script>
</body>
</html>
