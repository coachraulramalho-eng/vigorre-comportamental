<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Organização | VIGORRE ONE™</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0A2540; --blue: #1D4ED8; --gold: #D97706;
            --gray-50: #F8FAFC; --gray-100: #F1F5F9;
            --gray-500: #64748B; --gray-700: #334155; --gray-800: #1E293B; --gray-900: #0F172A;
            --radius: 16px; --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(10,37,64,0.06);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 48px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .container h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 12px;
        }
        .container p {
            color: var(--gray-500);
            font-size: 1rem;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--blue);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(29,78,216,0.25);
        }
        .btn-back {
            display: inline-block;
            padding: 10px 24px;
            background: var(--gray-100);
            color: var(--gray-700);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            margin-top: 16px;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--gray-200); }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
            text-align: left;
        }
        .info-card {
            background: var(--gray-50);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
        }
        .info-card label {
            font-size: 0.7rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .info-card .value {
            font-weight: 600;
            font-size: 1rem;
            color: var(--gray-800);
        }
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 Dashboard Organização</h1>
        <p>Gerencie as configurações e informações da sua organização.</p>

        <div class="info-grid">
            <div class="info-card">
                <label>Nome da Organização</label>
                <div class="value" id="orgNome">Carregando...</div>
            </div>
            <div class="info-card">
                <label>CNPJ</label>
                <div class="value" id="orgCnpj">Carregando...</div>
            </div>
            <div class="info-card">
                <label>Segmento</label>
                <div class="value" id="orgSegmento">Carregando...</div>
            </div>
            <div class="info-card">
                <label>Status</label>
                <div class="value" id="orgStatus">✅ Ativo</div>
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="/organizacao/configuracoes/index.html" class="btn">⚙️ Configurações</a>
            <a href="/organizacao/participantes/index.html" class="btn" style="background: var(--gold);">👥 Participantes</a>
            <a href="/dashboard.html" class="btn-back">← Voltar</a>
        </div>
    </div>

    <script src="/supabase-config.js"></script>
    <script src="/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏢 Dashboard Organização - VIGORRE ONE™');
            
            try {
                if (window.VigorreAuth && window.VigorreAuth.isAuthenticated()) {
                    var user = window.VigorreAuth.getCurrentUser();
                    if (user) {
                        document.getElementById('orgNome').textContent = user.companyName || 'Organização Exemplo';
                        document.getElementById('orgCnpj').textContent = '12.345.678/0001-99';
                        document.getElementById('orgSegmento').textContent = 'Tecnologia';
                    }
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.warn('⚠️ Erro ao carregar dados:', e);
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
