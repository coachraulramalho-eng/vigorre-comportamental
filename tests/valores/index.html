    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0A2540; --blue: #1D4ED8; --cyan: #06B6D4; --gold: #D97706;
            --green: #10B981; --red: #EF4444; --orange: #F59E0B; --purple: #7C3AED;
            --white: #FFFFFF; --gray-50: #F8FAFC; --gray-100: #F1F5F9;
            --gray-200: #E2E8F0; --gray-300: #CBD5E1; --gray-400: #94A3B8;
            --gray-500: #64748B; --gray-600: #475569; --gray-700: #334155;
            --gray-800: #1E293B; --gray-900: #0F172A;
            --radius: 16px; --radius-sm: 10px; --radius-full: 9999px;
            --shadow: 0 4px 24px rgba(10,37,64,0.06);
            --shadow-hover: 0 8px 40px rgba(10,37,64,0.10);
            --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }

        .header-premium {
            background: var(--navy);
            color: white;
            padding: 20px 32px;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-premium .logo {
            display: flex; align-items: center; gap: 12px; text-decoration: none;
        }
        .header-premium .logo .logo-img { height: 36px; width: auto; display: block; }
        .header-premium .logo .logo-text .name {
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 800; color: white;
        }
        .header-premium .logo .logo-text .name .tm { font-size: 0.4rem; vertical-align: super; color: var(--cyan); }
        .header-premium .logo .logo-text .sub {
            font-size: 0.5rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.05em;
        }
        .header-premium .header-title { text-align: center; }
        .header-premium .header-title h1 {
            font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700;
        }
        .header-premium .header-title .subtitle { font-size: 0.7rem; color: rgba(255,255,255,0.4); }
        .header-premium .header-user { text-align: right; }
        .header-premium .header-user .name { font-weight: 600; font-size: 0.9rem; }
        .header-premium .header-user .company { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

        .test-body {
            background: white;
            padding: 32px;
            border-left: 1px solid var(--gray-200);
            border-right: 1px solid var(--gray-200);
            min-height: 500px;
        }

        .intro-section { text-align: center; padding: 40px 20px; }
        .intro-section .icon { font-size: 4rem; margin-bottom: 16px; }
        .intro-section h2 {
            font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--gray-900);
            margin-bottom: 8px;
        }
        .intro-section p {
            color: var(--gray-500); font-size: 0.95rem; max-width: 600px;
            margin: 0 auto 20px; line-height: 1.7;
        }
        .intro-section .info-box {
            background: var(--gray-50); border-radius: var(--radius-sm); padding: 20px 24px;
            max-width: 500px; margin: 0 auto 24px; border: 1px solid var(--gray-200);
            text-align: left;
        }
        .intro-section .info-box .row {
            display: flex; justify-content: space-between; padding: 6px 0;
            font-size: 0.85rem; color: var(--gray-600); border-bottom: 1px solid var(--gray-100);
        }
        .intro-section .info-box .row:last-child { border-bottom: none; }
        .intro-section .info-box .row .label { font-weight: 600; color: var(--gray-700); }
        .intro-section .warning-box {
            background: #FEF3C7; border-radius: var(--radius-sm); padding: 16px 20px;
            max-width: 500px; margin: 0 auto 24px; border-left: 4px solid var(--gold);
            text-align: left; font-size: 0.85rem; color: var(--gray-700);
        }
        .intro-section .warning-box strong { color: var(--gold); }

            padding: 14px 48px; background: linear-gradient(135deg, var(--gold), var(--orange));
