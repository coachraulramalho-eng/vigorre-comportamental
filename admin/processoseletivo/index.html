<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avaliações Rápidas | VIGORRE ONE™</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/assets/css/menu-fix.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #0A2540;
            --blue: #1D4ED8;
            --cyan: #06B6D4;
            --gold: #D97706;
            --green: #10B981;
            --red: #EF4444;
            --orange: #F59E0B;
            --purple: #7C3AED;
            --white: #FFFFFF;

            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;

            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;

            --shadow: 0 4px 24px rgba(10,37,64,0.06);
            --shadow-hover: 0 8px 40px rgba(10,37,64,0.10);
            --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
        }

        .main {
            padding: 24px 32px 40px;
            min-height: 100vh;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .main-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }

        .main-header .subtitle {
            color: var(--gray-500);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(29,78,216,0.25);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(10,37,64,0.04);
            transition: var(--transition);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card .card-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .card .card-label {
            font-size: 0.7rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card .card-value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .card .card-change {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .card .card-change.up {
            color: var(--green);
        }

        .card .card-change.down {
            color: var(--red);
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(10,37,64,0.04);
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .table-container th {
            text-align: left;
            padding: 14px 18px;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-500);
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--gray-200);
        }

        .table-container td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
        }

        .table-container tr:last-child td {
            border-bottom: none;
        }

        .table-container tr:hover td {
            background: var(--gray-50);
        }

        .badge-status {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-status.aguardando {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-status.enviado {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .badge-status.iniciado {
            background: #E0E7FF;
            color: #3730A3;
        }

        .badge-status.andamento {
            background: #FCE7F3;
            color: #9D174D;
        }

        .badge-status.concluido {
            background: #D1FAE5;
            color: #065F46;
        }

        .badge-status.relatorio {
            background: #A7F3D0;
            color: #065F46;
        }

        .badge-status.laudo {
            background: #6EE7B7;
            color: #065F46;
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn-sm-primary {
            background: var(--blue);
            color: white;
        }

        .btn-sm-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(29,78,216,0.2);
        }

        .btn-sm-success {
            background: var(--green);
            color: white;
        }

        .btn-sm-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.2);
        }

        .btn-sm-gold {
            background: var(--gold);
            color: white;
        }

        .btn-sm-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217,119,6,0.2);
        }

        .btn-sm-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-sm-secondary:hover {
            background: var(--gray-200);
        }

        @media (max-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .main-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .main {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-profile="master">
    <main class="main vg-content">
        <div class="main-header">
            <div>
                <h1 data-vg-greeting-title>Avaliações Rápidas</h1>
                <p class="subtitle"
                   data-vg-greeting-subtitle
                   data-page-description="Processos seletivos privados e avaliações rápidas, com ou sem vínculo financeiro.">
                    Gerencie processos seletivos e avaliações de candidatos.
                </p>
            </div>

            <a href="/admin/processoseletivo/nova-avaliacao.html" class="btn-primary">
                ➕ Nova Avaliação
            </a>
        </div>

        <!-- CARDS -->
        <div class="cards-grid" id="cardsGrid">
            <div class="card">
                <div class="card-icon">👤</div>
                <div class="card-label">Candidatos</div>
                <div class="card-value" id="totalCandidatos">0</div>
                <div class="card-change up">📌 Cadastrados</div>
            </div>

            <div class="card">
                <div class="card-icon">⏳</div>
                <div class="card-label">Aguardando</div>
                <div class="card-value" id="totalAguardando">0</div>
                <div class="card-change up">📌 Não iniciaram</div>
            </div>

            <div class="card">
                <div class="card-icon">🔄</div>
                <div class="card-label">Em Andamento</div>
                <div class="card-value" id="totalAndamento">0</div>
                <div class="card-change up">📌 Iniciaram</div>
            </div>

            <div class="card">
                <div class="card-icon">✅</div>
                <div class="card-label">Concluídos</div>
                <div class="card-value" id="totalConcluidos">0</div>
                <div class="card-change up">📌 Finalizados</div>
            </div>

            <div class="card">
                <div class="card-icon">📋</div>
                <div class="card-label">Laudos Gerados</div>
                <div class="card-value" id="totalLaudos">0</div>
                <div class="card-change up">📌 Emitidos</div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Candidato</th>
                        <th>Empresa</th>
                        <th>Vaga</th>
                        <th>Teste</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th style="text-align:center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dados carregados via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="/assets/js/menu-fix.js"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth.js"></script>
    <script src="/middleware/auth-guard.js"></script>

    <script>
        // ============================================
        // DADOS MOCK (exemplo)
        // ============================================
        const mockData = [
            {
                id: 1,
                nome: 'Ana Silva',
                empresa: 'TechCorp',
                vaga: 'Analista de RH',
                teste: 'DISC',
                status: 'concluido',
                data: '14/08/2026',
                laudo: true
            },
            {
                id: 2,
                nome: 'João Santos',
                empresa: 'InovaLab',
                vaga: 'Vendedor',
                teste: 'IE',
                status: 'andamento',
                data: '14/08/2026',
                laudo: false
            },
            {
                id: 3,
                nome: 'Maria Oliveira',
                empresa: 'StartupX',
                vaga: 'Assistente',
                teste: 'Valores',
                status: 'aguardando',
                data: '13/08/2026',
                laudo: false
            },
            {
                id: 4,
                nome: 'Pedro Lima',
                empresa: 'AgroTech',
                vaga: 'Supervisor',
                teste: 'Big Five',
                status: 'enviado',
                data: '13/08/2026',
                laudo: false
            },
            {
                id: 5,
                nome: 'Carla Souza',
                empresa: 'FinCorp',
                vaga: 'Gerente',
                teste: 'SWOT',
                status: 'concluido',
                data: '12/08/2026',
                laudo: true
            }
        ];

        const statusMap = {
            aguardando: {
                label: '⏳ Aguardando',
                class: 'aguardando'
            },
            enviado: {
                label: '📨 Enviado',
                class: 'enviado'
            },
            iniciado: {
                label: '▶️ Iniciado',
                class: 'iniciado'
            },
            andamento: {
                label: '🔄 Em andamento',
                class: 'andamento'
            },
            concluido: {
                label: '✅ Concluído',
                class: 'concluido'
            },
            relatorio: {
                label: '📄 Relatório',
                class: 'relatorio'
            },
            laudo: {
                label: '📋 Laudo',
                class: 'laudo'
            }
        };

        function renderTable() {
            const tbody = document.getElementById('tableBody');

            tbody.innerHTML = mockData.map(item => {
                const status = statusMap[item.status] || statusMap.aguardando;

                return `
                    <tr>
                        <td><strong>${item.nome}</strong></td>
                        <td>${item.empresa || '-'}</td>
                        <td>${item.vaga || '-'}</td>
                        <td>${item.teste}</td>
                        <td>
                            <span class="badge-status ${status.class}">
                                ${status.label}
                            </span>
                        </td>
                        <td>${item.data}</td>
                        <td style="text-align:center;">
                            <button class="btn-sm btn-sm-primary" onclick="verCandidato(${item.id})">
                                👁️
                            </button>

                            ${
                                item.laudo
                                    ? `<button class="btn-sm btn-sm-gold" onclick="verLaudo(${item.id})">📋</button>`
                                    : ''
                            }
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('totalCandidatos').textContent = mockData.length;
            document.getElementById('totalAguardando').textContent = mockData.filter(i => i.status === 'aguardando').length;
            document.getElementById('totalAndamento').textContent = mockData.filter(i => i.status === 'andamento' || i.status === 'iniciado').length;
            document.getElementById('totalConcluidos').textContent = mockData.filter(i => i.status === 'concluido').length;
            document.getElementById('totalLaudos').textContent = mockData.filter(i => i.laudo).length;
        }

        function verCandidato(id) {
            alert(`👁️ Visualizar candidato ID: ${id}`);
        }

        function verLaudo(id) {
            alert(`📋 Visualizar laudo do candidato ID: ${id}`);
        }

        document.addEventListener('DOMContentLoaded', function () {
            console.log('📋 Avaliações Rápidas - VIGORRE ONE™');
            renderTable();
        });
    </script>
</body>
</html>
