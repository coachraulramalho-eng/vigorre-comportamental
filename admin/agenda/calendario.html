<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda | VIGORRE ONE™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0A2540; --blue: #1D4ED8; --cyan: #06B6D4; --gold: #D97706;
            --green: #10B981; --red: #EF4444; --white: #FFFFFF;
            --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
            --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
            --gray-600: #475569; --gray-700: #334155; --gray-800: #1E293B;
            --gray-900: #0F172A;
            --radius: 16px; --radius-sm: 10px; --shadow: 0 4px 24px rgba(10,37,64,0.06);
            --transition: 0.3s ease;
        }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
            background: var(--navy); color: white; padding: 24px 20px;
            display: flex; flex-direction: column; z-index: 100;
            transition: var(--transition); overflow-y: auto;
        }
        .sidebar .logo {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none; margin-bottom: 32px;
            padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar .logo .logo-text .name {
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 800; color: white;
        }
        .sidebar .logo .logo-text .name .tm { font-size: 0.4rem; vertical-align: super; color: var(--cyan); }
        .sidebar .logo .logo-text .sub { font-size: 0.5rem; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .sidebar .user-info {
            padding: 16px 12px; background: rgba(255,255,255,0.04);
            border-radius: var(--radius-sm); margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .sidebar .user-info .name { font-weight: 600; font-size: 0.9rem; }
        .sidebar .user-info .role { font-size: 0.7rem; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .sidebar .user-info .role .badge {
            display: inline-block; padding: 2px 10px; background: rgba(217,119,6,0.15);
            color: var(--gold); border-radius: 999px; font-size: 0.6rem; font-weight: 600;
        }
        .sidebar .nav { list-style: none; flex: 1; }
        .sidebar .nav li { margin-bottom: 2px; }
        .sidebar .nav a {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: var(--radius-sm); color: rgba(255,255,255,0.6);
            text-decoration: none; font-size: 0.85rem; font-weight: 500;
            transition: var(--transition); cursor: pointer;
        }
        .sidebar .nav a:hover { background: rgba(255,255,255,0.06); color: white; }
        .sidebar .nav a.active {
            background: rgba(217,119,6,0.12); color: white; border-left: 3px solid var(--gold);
        }
        .sidebar .nav a .icon { font-size: 1.1rem; width: 24px; text-align: center; }
        .sidebar .nav .divider { height: 1px; background: rgba(255,255,255,0.04); margin: 12px 0; }
        .sidebar .logout { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
        .sidebar .logout a {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: var(--radius-sm); color: rgba(255,255,255,0.4);
            text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: var(--transition); cursor: pointer;
        }
        .sidebar .logout a:hover { background: rgba(239,68,68,0.12); color: #F87171; }

        .main { margin-left: 260px; padding: 24px 32px 40px; min-height: 100vh; }
        .main-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
        }
        .main-header h1 { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--gray-900); }
        .main-header .subtitle { color: var(--gray-500); font-size: 0.9rem; }

        .btn-primary {
            padding: 10px 24px; background: linear-gradient(135deg, var(--blue), var(--cyan));
            color: white; border: none; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 0.875rem; cursor: pointer;
            transition: var(--transition); display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(29,78,216,0.25); }
        .btn-secondary {
            padding: 10px 24px; background: var(--gray-100); color: var(--gray-700);
            border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: var(--transition);
        }
        .btn-secondary:hover { background: var(--gray-200); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(10,37,64,0.04);
        }

        .calendar-grid .day-header {
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            padding: 8px 0;
        }

        .calendar-grid .day {
            text-align: center;
            padding: 12px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 60px;
            border: 1px solid transparent;
        }

        .calendar-grid .day:hover {
            background: var(--gray-100);
            border-color: var(--gray-200);
        }

        .calendar-grid .day.other-month {
            color: var(--gray-300);
        }

        .calendar-grid .day.today {
            background: var(--blue);
            color: white;
            font-weight: 700;
        }

        .calendar-grid .day.today:hover {
            background: var(--blue);
            opacity: 0.9;
        }

        .calendar-grid .day.has-event {
            border-color: var(--cyan);
            position: relative;
        }

        .calendar-grid .day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
        }

        .mobile-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray-700); padding: 8px; }
        .mobile-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,37,64,0.4); backdrop-filter: blur(4px); z-index: 99;
        }
        .mobile-overlay.active { display: block; }

        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 16px; }
            .mobile-toggle { display: block; }
            .mobile-overlay.active { display: block; }
        }
        @media (max-width: 768px) {
            .main-header { flex-direction: column; align-items: flex-start; }
            .calendar-grid { padding: 8px; gap: 2px; }
            .calendar-grid .day { padding: 8px 4px; font-size: 0.8rem; min-height: 40px; }
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <a href="../dashboard.html" class="logo">
            <div class="logo-text">
                <span class="name">VIGORRE ONE<span class="tm">™</span></span>
                <span class="sub">People Analytics Enterprise</span>
            </div>
        </a>
        <div class="user-info">
            <div class="name" id="userName">Administrador</div>
            <div class="role"><span class="badge">👑 Master Admin</span></div>
        </div>
        <ul class="nav">
            <li><a href="../dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
            <li><a href="../empresas/index.html"><span class="icon">🏢</span> Empresas</a></li>
            <li><a href="../recrutadores/index.html"><span class="icon">👤</span> Recrutadores</a></li>
            <li><a href="../participantes/index.html"><span class="icon">👥</span> Participantes</a></li>
            <li><a href="../financeiro/index.html"><span class="icon">💰</span> Centro Financeiro</a></li>
            <div class="divider"></div>
            <li><a href="calendario.html" class="active"><span class="icon">📅</span> Agenda</a></li>
            <li><a href="../backup/backup-completo.html"><span class="icon">💾</span> Backup</a></li>
            <li><a href="../financeiro/configuracoes.html"><span class="icon">⚙️</span> Configurações</a></li>
        </ul>
        <div class="logout">
            <a href="#" onclick="logout()"><span class="icon">🚪</span> Sair</a>
        </div>
    </aside>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <main class="main">
        <div class="main-header">
            <div>
                <h1>📅 Agenda</h1>
                <p class="subtitle">Calendário e agendamentos</p>
            </div>
            <div style="display:flex;gap:12px;">
                <button class="btn-primary" onclick="novoEvento()">➕ Novo Evento</button>
                <button class="btn-secondary" onclick="recarregar()">🔄 Atualizar</button>
            </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="font-family:'Poppins',sans-serif;font-weight:600;" id="mesAtual">Maio 2025</h3>
            <div style="display:flex;gap:8px;">
                <button class="btn-secondary" style="padding:6px 16px;font-size:0.8rem;" onclick="mesAnterior()">◀</button>
                <button class="btn-secondary" style="padding:6px 16px;font-size:0.8rem;" onclick="mesAtualizar()">Hoje</button>
                <button class="btn-secondary" style="padding:6px 16px;font-size:0.8rem;" onclick="mesProximo()">▶</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <div class="day-header">Dom</div>
            <div class="day-header">Seg</div>
            <div class="day-header">Ter</div>
            <div class="day-header">Qua</div>
            <div class="day-header">Qui</div>
            <div class="day-header">Sex</div>
            <div class="day-header">Sáb</div>
        </div>
    </main>

    <script>
        let mesAtual = new Date().getMonth();
        let anoAtual = new Date().getFullYear();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('mobileOverlay').classList.toggle('active');
        }

        function logout() {
            if (confirm('Deseja realmente sair?')) {
                alert('Logout realizado!');
                window.location.href = '../../login.html';
            }
        }

        function novoEvento() {
            alert('📝 Abrir formulário de novo evento (em desenvolvimento)');
        }

        function recarregar() {
            alert('🔄 Dados atualizados!');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const mesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            document.getElementById('mesAtual').textContent = `${mesNomes[mesAtual]} ${anoAtual}`;

            // Remove dias antigos (mantém cabeçalhos)
            while (grid.children.length > 7) {
                grid.removeChild(grid.lastChild);
            }

            const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
            const diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
            const diasNoMesAnterior = new Date(anoAtual, mesAtual, 0).getDate();
            const hoje = new Date();

            // Dias do mês anterior
            for (let i = primeiroDia - 1; i >= 0; i--) {
                const dia = document.createElement('div');
                dia.className = 'day other-month';
                dia.textContent = diasNoMesAnterior - i;
                grid.appendChild(dia);
            }

            // Dias do mês atual
            for (let i = 1; i <= diasNoMes; i++) {
                const dia = document.createElement('div');
                dia.className = 'day';
                dia.textContent = i;

                if (i === hoje.getDate() && mesAtual === hoje.getMonth() && anoAtual === hoje.getFullYear()) {
                    dia.classList.add('today');
                }

                // Simular eventos
                if (i % 5 === 0 || i === 10 || i === 20) {
                    dia.classList.add('has-event');
                }

                dia.onclick = function() {
                    alert(`📅 ${i} de ${mesNomes[mesAtual]} de ${anoAtual}\n\nClique para ver eventos do dia.`);
                };

                grid.appendChild(dia);
            }

            // Dias do próximo mês
            const totalDias = primeiroDia + diasNoMes;
            const diasRestantes = 42 - totalDias;
            for (let i = 1; i <= diasRestantes; i++) {
                const dia = document.createElement('div');
                dia.className = 'day other-month';
                dia.textContent = i;
                grid.appendChild(dia);
            }
        }

        function mesAnterior() {
            mesAtual--;
            if (mesAtual < 0) {
                mesAtual = 11;
                anoAtual--;
            }
            renderCalendar();
        }

        function mesProximo() {
            mesAtual++;
            if (mesAtual > 11) {
                mesAtual = 0;
                anoAtual++;
            }
            renderCalendar();
        }

        function mesAtualizar() {
            mesAtual = new Date().getMonth();
            anoAtual = new Date().getFullYear();
            renderCalendar();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderCalendar();
            console.log('✅ Agenda carregado!');
        });
    </script>

</body>
</html>
