<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Créditos | VIGORRE ONE™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --navy: #0A2540; --blue: #1D4ED8; --gold: #D97706; --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-500: #64748B; --gray-700: #334155; --gray-800: #1E293B; --gray-900: #0F172A; --radius: 16px; --radius-sm: 10px; --shadow: 0 4px 24px rgba(10,37,64,0.06); }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); }
        h1 { font-family: 'Poppins', sans-serif; color: var(--navy); margin-bottom: 8px; }
        p { color: var(--gray-500); margin-bottom: 24px; }
        .card-creditos { background: var(--gray-50); padding: 24px; border-radius: var(--radius-sm); text-align: center; margin-bottom: 20px; }
        .card-creditos .valor { font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; color: var(--gold); }
        .card-creditos .label { font-size: 0.8rem; color: var(--gray-500); }
        .btn-back { display: inline-block; padding: 10px 24px; background: var(--gray-100); color: var(--gray-700); text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; margin-top: 12px; }
        .btn-back:hover { background: var(--gray-200); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Meus Créditos</h1>
        <p>Visualize seus créditos disponíveis para relatórios e laudos.</p>
        <div class="card-creditos">
            <div class="label">CRÉDITOS DISPONÍVEIS</div>
            <div class="valor" id="creditos-disponiveis">0</div>
        </div>
        <a href="index.html" class="btn-back">← Voltar ao Dashboard</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Simular carregamento de créditos
            document.getElementById('creditos-disponiveis').textContent = '5';
        });
    </script>
</body>
</html>
