<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Evolução | VIGORRE ONE™</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0A2540; --blue: #1D4ED8; --cyan: #06B6D4; --gold: #D97706;
            --green: #10B981; --red: #EF4444; --orange: #F59E0B; --purple: #7C3AED;
            --white: #FFFFFF; --gray-50: #F8FAFC; --gray-100: #F1F5F9;
            --gray-200: #E2E8F0; --gray-300: #CBD5E1; --gray-400: #94A3B8;
            --gray-500: #64748B; --gray-600: #475569; --gray-700: #334155;
            --gray-800: #1E293B; --gray-900: #0F172A;
            --radius: 16px; --radius-sm: 10px; --radius-full: 9999px;
            --shadow: 0 4px 24px rgba(10,37,64,0.06);
            --shadow-hover: 0 8px 40px rgba(10,37,64,0.10);
            --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
        }

        .header-participante {
            background: var(--navy);
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 3px solid var(--gold);
        }
        .header-participante .logo {
            display: flex; align-items: center; gap: 12px; text-decoration: none;
        }
        .header-participante .logo .logo-img { height: 36px; width: auto; display: block; }
        .header-participante .logo .logo-text .name {
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 800; color: white;
        }
        .header-participante .logo .logo-text .name .tm { font-size: 0.4rem; vertical-align: super; color: var(--cyan); }
        .header-participante .logo .logo-text .sub {
            font-size: 0.5rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.05em;
        }
        .header-participante .user-info {
            text-align: right;
        }
        .header-participante .user-info .name {
            font-weight: 600; font-size: 0.9rem;
        }
        .header-participante .user-info .company {
            font-size: 0.75rem; color: rgba(255,255,255,0.4);
        }
        .header-participante .user-info .badge {
            display: inline-block; padding: 2px 10px; background: rgba(217,119,6,0.15);
            color: var(--gold); border-radius: var(--radius-full); font-size: 0.6rem; font-weight: 600;
        }

        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 32px 40px;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .main-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .main-header .subtitle {
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .btn-back {
            padding: 8px 20px;
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover { background: var(--gray-200); }

        .evolucao-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .chart-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(10,37,64,0.04);
        }
        .chart-card h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 12px;
        }
        .chart-container {
            height: 300px;
            position: relative;
        }

        .info-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(10,37,64,0.04);
        }
        .info-card h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 12px;
        }
        .info-card .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .info-card .info-item:last-child { border-bottom: none; }
        .info-card .info-item .label {
            color: var(--gray-500);
            font-size: 0.85rem;
        }
        .info-card .info-item .value {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray-800);
        }
        .info-card .info-item .value.concluido { color: var(--green); }
        .info-card .info-item .value.pendente { color: var(--orange); }

        .proximo-passo {
            background: linear-gradient(135deg, var(--navy), var(--gray-800));
            color: white;
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 20px;
            text-align: center;
        }
        .proximo-passo h4 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .proximo-passo p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .proximo-passo .btn-gold {
            padding: 8px 24px;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }
        .proximo-passo .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(217,119,6,0.25); }

        .toast {
            position: fixed; top: 24px; right: 24px; background: white;
            padding: 14px 24px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            display: none; align-items: center; gap: 12px;
            font-weight: 600; font-size: 0.875rem; z-index: 300;
            border-left: 4px solid var(--blue);
            animation: slideIn 0.3s ease;
        }
        .toast.show { display: flex; }
        .toast.success { border-left-color: #10B981; }
        .toast.error { border-left-color: #EF4444; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(120%); }
            to { opacity: 1; transform: translateX(0); }
        }

        .loading-shimmer {
            height: 32px; width: 60%;
            background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            display: inline-block;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @media (max-width: 992px) {
            .evolucao-grid { grid-template-columns: 1fr; }
            .header-participante { flex-direction: column; text-align: center; }
            .header-participante .user-info { text-align: center; }
            .main { padding: 16px 20px; }
        }
        @media (max-width: 768px) {
            .main-header { flex-direction: column; align-items: flex-start; }
        }

        @media print {
            .header-participante { background: #0A2540 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .btn-back, .btn-gold { display: none !important; }
            .chart-card { border: 1px solid #E2E8F0 !important; }
            .info-card { border: 1px solid #E2E8F0 !important; }
        }
    </style>
</head>
<body>

    <header class="header-participante">
        <div class="logo">
            <img src="../assets/images/logo-vigorre.png" alt="VIGORRE ONE™" class="logo-img" />
            <div class="logo-text">
                <span class="name">VIGORRE ONE<span class="tm">™</span></span>
                <span class="sub">People Analytics Enterprise</span>
            </div>
        </div>
        <div class="user-info">
            <div class="name" id="participantName">Carregando...</div>
            <div class="company" id="participantCompany">Empresa: --</div>
            <div><span class="badge">👤 Participante</span></div>
        </div>
    </header>

    <div class="main">
        <div class="main-header">
            <div>
                <h1>📈 Minha Evolução</h1>
                <p class="subtitle">Acompanhe seu progresso nos testes comportamentais</p>
            </div>
            <a href="index.html" class="btn-back">← Voltar ao Dashboard</a>
        </div>

        <div class="evolucao-grid">
            <div class="chart-card">
                <h3>📊 Progresso dos Testes</h3>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>

            <div class="info-card">
                <h3>📋 Resumo</h3>
                <div id="infoResumo">
                    <!-- Carregado via JS -->
                </div>
                <div class="proximo-passo" id="proximoPasso">
                    <!-- Carregado via JS -->
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">Mensagem</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="../supabase-config.js"></script>
    <script src="../auth.js"></script>
    <script src="../middleware/auth-guard.js"></script>
    <script src="../admin/financeiro/financeiro-conexao.js"></script>

    <script>
        'use strict';

        let resultados = {};
        let participanteId = null;

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            if (type === 'error') icon.textContent = '❌';
            else if (type === 'warning') icon.textContent = '⚠️';
            else icon.textContent = '✅';
            msg.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        async function carregarDados() {
            try {
                if (!window.VigorreAuth || !window.VigorreAuth.isAuthenticated()) {
                    window.location.href = '../login.html';
                    return;
                }

                var user = window.VigorreAuth.getCurrentUser();
                if (!user || user.role !== 'participante') {
                    window.location.href = '../login.html';
                    return;
                }

                participanteId = user.id || user.participantId;
                document.getElementById('participantName').textContent = user.name || 'Participante';

                var companyName = 'Autônomo';
                if (user.companyId) {
                    try {
                        var supabaseClient = getSupabaseClient();
                        if (supabaseClient) {
                            var { data: company } = await supabaseClient
                                .from('companies')
                                .select('name')
                                .eq('id', user.companyId)
                                .single();
                            if (company) companyName = company.name;
                        }
                    } catch (e) {}
                }
                document.getElementById('participantCompany').textContent = 'Empresa: ' + companyName;

                await carregarResultados();
                renderizarEvolucao();
                renderizarGrafico();

            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                showToast('Erro ao carregar dados', 'error');
            }
        }

        async function carregarResultados() {
            try {
                var supabaseClient = getSupabaseClient();
                if (!supabaseClient) {
                    var allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
                    var participant = allParticipants.find(p => p.id === participanteId);
                    if (participant && participant.results) {
                        resultados = participant.results;
                    }
                    return;
                }

                var { data, error } = await supabaseClient
                    .from('resultados')
                    .select('teste_id, resultado')
                    .eq('participant_id', participanteId);

                if (error) {
                    console.warn('Erro ao buscar resultados:', error);
                    return;
                }

                if (data) {
                    for (var i = 0; i < data.length; i++) {
                        var testeId = data[i].teste_id;
                        var resultado = data[i].resultado;
                        if (testeId === '11111111-1111-1111-1111-111111111111') resultados.DISC = resultado;
                        else if (testeId === '22222222-2222-2222-2222-222222222222') resultados.BigFive = resultado;
                        else if (testeId === '33333333-3333-3333-3333-333333333333') resultados.IE = resultado;
                        else if (testeId === '44444444-4444-4444-4444-444444444444') resultados.Valores = resultado;
                        else if (testeId === '55555555-5555-5555-5555-555555555555') resultados.SWOT = resultado;
                    }
                }

            } catch (error) {
                console.warn('⚠️ Erro ao carregar resultados:', error);
            }
        }

        function renderizarEvolucao() {
            var testes = [
                { id: 'DISC', nome: 'DISC', icon: '🦁', concluido: !!resultados.DISC },
                { id: 'BigFive', nome: 'Big Five', icon: '🧬', concluido: !!resultados.BigFive },
                { id: 'IE', nome: 'IE', icon: '❤️', concluido: !!resultados.IE },
                { id: 'Valores', nome: 'Valores', icon: '💎', concluido: !!resultados.Valores },
                { id: 'SWOT', nome: 'SWOT', icon: '📊', concluido: !!resultados.SWOT }
            ];

            var total = testes.length;
            var concluidos = testes.filter(t => t.concluido).length;
            var faltam = total - concluidos;

            var infoHtml = `
                <div class="info-item">
                    <span class="label">📝 Testes Concluídos</span>
                    <span class="value concluido">${concluidos}/${total}</span>
                </div>
                <div class="info-item">
                    <span class="label">⏳ Pendentes</span>
                    <span class="value pendente">${faltam}</span>
                </div>
                <div class="info-item">
                    <span class="label">📊 Progresso</span>
                    <span class="value">${Math.round((concluidos/total)*100)}%</span>
                </div>
                <div style="margin-top:12px;">
                    ${testes.map(t => `
                        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.85rem;">
                            <span>${t.icon} ${t.nome}</span>
                            <span style="color:${t.concluido ? 'var(--green)' : 'var(--orange)'};">${t.concluido ? '✅' : '⏳'}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('infoResumo').innerHTML = infoHtml;

            // Próximo passo
            var proximo = document.getElementById('proximoPasso');
            if (concluidos === total) {
                proximo.innerHTML = `
                    <h4>🎉 Parabéns!</h4>
                    <p>Você completou todos os testes! Que tal gerar seu Laudo VIGOR®?</p>
                    <a href="meu-laudo.html" class="btn-gold">📋 Ver Meu Laudo</a>
                `;
            } else {
                var proximoTeste = testes.find(t => !t.concluido);
                proximo.innerHTML = `
                    <h4>🚀 Próximo Passo</h4>
                    <p>Complete o teste <strong>${proximoTeste.nome}</strong> para continuar sua evolução.</p>
                    <a href="../tests/${proximoTeste.id.toLowerCase()}/" class="btn-gold">▶️ Fazer Teste</a>
                `;
            }
        }

        function renderizarGrafico() {
            try {
                var ctx = document.getElementById('progressChart').getContext('2d');

                var testes = ['DISC', 'Big Five', 'IE', 'Valores', 'SWOT'];
                var dados = testes.map(t => !!resultados[t] ? 100 : 0);
                var cores = testes.map(t => !!resultados[t] ? '#10B981' : '#E2E8F0');

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: testes,
                        datasets: [{
                            label: 'Progresso',
                            data: dados,
                            backgroundColor: cores,
                            borderColor: cores.map(c => c === '#10B981' ? '#10B981' : '#CBD5E1'),
                            borderWidth: 2,
                            borderRadius: 8,
                            maxBarThickness: 50
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return context.parsed.y === 100 ? '✅ Concluído' : '⏳ Pendente';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                grid: { color: 'rgba(10,37,64,0.04)' },
                                ticks: { color: '#94A3B8', callback: function(v) { return v + '%'; } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#94A3B8', font: { size: 11 } }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('❌ Erro ao renderizar gráfico:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('📈 Minha Evolução - VIGORRE ONE™');
            carregarDados();
        });

        console.log('✅ Minha Evolução carregado com sucesso!');
    </script>

</body>
</html>
